apiVersion: batch/v1
kind: Job
metadata:
  name: v5p32-omni-video-dp6
  namespace: default
  labels:
    app: v5p-32-spot-omni-serving-p2
    workload: v5p-video-serving-ltx25-3-omni
spec:
  completionMode: Indexed
  completions: 6
  parallelism: 6
  backoffLimit: 4
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: v5p-32-spot-omni-serving-p2
        workload: v5p-video-serving-ltx25-3-omni
    spec:
      terminationGracePeriodSeconds: 10
      restartPolicy: Never
      serviceAccountName: default
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v5p-32-pool
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x4x4
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-queued"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: omni-video-serve
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/vllm-torchtpu-omni:v0.32.0
        imagePullPolicy: IfNotPresent
        env:
        - name: PJRT_DEVICE
          value: "TPU"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          TOK=$(curl -sS -H "Metadata-Flavor: Google" "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -fsSL -H "Authorization: Bearer ${TOK}" \
            "https://storage.googleapis.com/storage/v1/b/YOUR_GCS_BUCKET/o/v5p-video-serving-scripts%2Frun_v5p_ltx25_wan22_omni_p2.py?alt=media" \
            -o /tmp/run_v5p_ltx25_wan22_omni_p2.py
          exec python3 -u /tmp/run_v5p_ltx25_wan22_omni_p2.py \
            --gcs-bucket=YOUR_GCS_BUCKET \
            --run-id=v5p32_spot_omni_serve_p2_dp6 \
            --num-pods=6
        resources:
          requests:
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
